<!DOCTYPE html>
<html lang="en">
<head>
<title>zombie game</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="zombie%20game%20styles%20copy.css">
</head>
<body>

    <section>
      
        <header>
          <h1>Zombie Game</h1>
        </header>

        <article class="article">
        <canvas id="myCanvas" style="border:5px solid #d3d3d3;">
        Your browser does not support the HTML canvas tag.</canvas>

        <img src="./images/up%20arrow.png" height="50" size="50" alt="up" onclick="up_arrow()">
        <img src="./images/down%20arrow.png" height="50" size="50" alt="down" onclick="down_arrow()">
        <img src="./images/right_arrow.png" height="50" size="50" alt="right" onclick="right_arrow()"> 

       <img id="smallzombie" src="./images/zombiebaby.PNG" alt="small zombie" style="display: none;">
       <img id="bigzombie" src="./images/zombie1.PNG" alt="big zombie" style="display: none;">
       <img id="poop" src="./images/poop2.PNG" alt="poop" style="display: none;">
       <img id="baby" src="./images/baby1.PNG" alt="baby" style="display: none;">
       <img id="knife" src="./images/knife1.PNG" alt="knife" style="display: none;">
       <img id="zombie_end" src="./images/zombieend.PNG" alt="zombie end" style="display: none;">
       <img id="level1" src="./images/level1.PNG" alt="level1" style="display: none;">
       <img id="level2" src="./images/level2.PNG" alt="level2" style="display: none;">
       <img id="level3" src="./images/level3.PNG" alt="level3" style="display: none;">
       <img id="level4" src="./images/level4.PNG" alt="level4" style="display: none;">
       <img id="level5" src="./images/level5.PNG" alt="level5" style="display: none;">
       <img id="level6" src="./images/level6.PNG" alt="level6" style="display: none;">
       <img id="level7" src="./images/level7.PNG" alt="level7" style="display: none;">
       <img id="level8" src="./images/level8.PNG" alt="level8" style="display: none;">
       <img id="level9" src="./images/level9.PNG" alt="level9" style="display: none;">
       <img id="level10" src="./images/level10.PNG" alt="level10" style="display: none;">
       
        </article>
  
      </section>

     <script src="zombie%20game%20js%20copy.js"></script>

</body>
</html>
